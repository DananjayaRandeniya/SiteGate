name: SiteGate portal

on:
  pull_request:
    paths:
      - .github/workflows/portal.yml
      - apps/web/**
      - backend/.dockerignore
      - backend/docker-compose.yml
      - backend/apps/**
      - backend/libs/**
      - backend/scripts/**
      - backend/nest-cli.json
      - backend/package*.json
      - backend/tsconfig*.json

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  docker:
    name: Build and start the Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose -f backend/docker-compose.yml --profile portal config --quiet
      - name: Start the portal and its backends
        run: docker compose -f backend/docker-compose.yml up -d --build --wait --wait-timeout 150 web
      - name: Check the running portal and service connections
        run: |
          curl --fail --silent --show-error --max-time 10 http://localhost:3000/api/health
          curl --fail --silent --show-error --max-time 10 http://localhost:3000/workers > /dev/null
          docker compose -f backend/docker-compose.yml exec -T web node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          assert.ok(process.getuid() > 0);
          for (const name of ["WORKER", "ACCESS", "AUDIT_ALERT"]) {
            const url = process.env[name + "_SERVICE_URL"];
            const response = await fetch(url + "/health", { signal: AbortSignal.timeout(5000) });
            assert.equal(response.status, 200, url);
            assert.equal((await response.json()).status, "ok", url);
          }
          NODE
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f backend/docker-compose.yml --profile portal logs --no-color --tail 100
      - name: Stop the test stack
        if: always()
        run: docker compose -f backend/docker-compose.yml --profile portal down --volumes
